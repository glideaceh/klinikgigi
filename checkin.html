<!-- Struktur UI Halaman Check-In Terpisah -->
<div class="checkin-sidebar" id="checkinSidebar">
    <div class="checkin-header">
        <button class="back-btn" onclick="closeCheckInPage()"><i class="fa-solid fa-arrow-left"></i></button>
        <h3 style="font-size: 18px; font-weight: 700;">Check-in Pasien</h3>
    </div>
    
    <div class="checkin-content" id="checkinListContainer">
        
        <!-- ====== DATA DUMMY 1: Pasien Perempuan ====== -->
        <div class="reg-queue-card" style="animation-delay: 0s; margin-bottom: 12px;">
            <div class="reg-card-header">
                <div class="reg-header-left">
                    <div class="reg-queue-no">A-01</div>
                    <div class="reg-time-tag">
                        <i class="fa-regular fa-clock"></i>
                        <span>08:30</span>
                    </div>
                </div>
                <!-- Ganti class status sesuai CSS Anda (misal: bg-warning, text-warning) -->
                <span class="status-badge badge-warning">Menunggu</span>
            </div>
            <div class="reg-patient-body">
                <!-- Warna gradient khusus Perempuan -->
                <div class="patient-avatar-box" style="background: linear-gradient(135deg, #FCE7F3, #FBCFE8); color: #DB2777;">
                    SR
                    <span class="gender-dot female"><i class="fa-solid fa-venus"></i></span>
                </div>
                <div class="reg-patient-details">
                    <h5 class="patient-name">Siti Rahma</h5>
                    <div class="reg-meta-sub"><span class="rm-badge">RM-102938</span></div>
                </div>
            </div>
            <div class="reg-card-divider"></div>
            <div class="reg-card-footer">
                <div class="reg-doctor-info">
                    <span class="reg-doctor-label"><i class="fa-solid fa-user-doctor" style="font-size: 9px; color: #00b894;"></i> Ditangani oleh</span>
                    <span class="reg-doctor-name">drg. Budi Santoso</span>
                </div>
                <button class="btn-checkin-cool" onclick="processCheckIn(this, 'Siti Rahma')">
                    <i class="fa-solid fa-qrcode"></i> Check-in
                </button>
            </div>
        </div>

        <!-- ====== DATA DUMMY 2: Pasien Laki-laki ====== -->
        <div class="reg-queue-card" style="animation-delay: 0.05s; margin-bottom: 12px;">
            <div class="reg-card-header">
                <div class="reg-header-left">
                    <div class="reg-queue-no">B-05</div>
                    <div class="reg-time-tag">
                        <i class="fa-regular fa-clock"></i>
                        <span>09:15</span>
                    </div>
                </div>
                <span class="status-badge badge-warning">Menunggu</span>
            </div>
            <div class="reg-patient-body">
                <!-- Warna gradient khusus Laki-laki -->
                <div class="patient-avatar-box" style="background: linear-gradient(135deg, #E0F2FE, #BAE6FD); color: #0284C7;">
                    AW
                    <span class="gender-dot male"><i class="fa-solid fa-mars"></i></span>
                </div>
                <div class="reg-patient-details">
                    <h5 class="patient-name">Ahmad Wijaya</h5>
                    <div class="reg-meta-sub"><span class="rm-badge">RM-992837</span></div>
                </div>
            </div>
            <div class="reg-card-divider"></div>
            <div class="reg-card-footer">
                <div class="reg-doctor-info">
                    <span class="reg-doctor-label"><i class="fa-solid fa-user-doctor" style="font-size: 9px; color: #00b894;"></i> Ditangani oleh</span>
                    <span class="reg-doctor-name">drg. Anita</span>
                </div>
                <button class="btn-checkin-cool" onclick="processCheckIn(this, 'Ahmad Wijaya')">
                    <i class="fa-solid fa-qrcode"></i> Check-in
                </button>
            </div>
        </div>

    </div>
</div>

<!-- Script Khusus Check-in -->
<script>
    function closeCheckInPage() {
        const frame = document.getElementById('mainFrame');
        const sidebar = document.getElementById('checkinSidebar');
        
        sidebar.classList.remove('active');
        
        setTimeout(() => {
            frame.style.overflowY = ''; 
            sidebar.style.top = '0px';
        }, 400); 
    }

    // Biarkan fungsi ini kosong sementara jika Anda hanya ingin melihat desain statis HTML di atas
    // Hapus komentar isi fungsi jika ingin kembali menggunakan rendering otomatis dari JavaScript
    function renderCheckInList() {
        /*
        const container = document.getElementById('checkinListContainer');
        const list = window.registrationQueueData ? window.registrationQueueData['today'] : [];
        container.innerHTML = '';
        ... (isi kode javascript Anda sebelumnya) ...
        */
    }

    // Animasi Proses Loading Button Check-in
    function processCheckIn(btn, name) {
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
        btn.style.pointerEvents = 'none';
        setTimeout(() => {
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Selesai';
            btn.style.background = 'linear-gradient(135deg, #10B981, #059669)';
            btn.style.boxShadow = '0 4px 15px rgba(16, 185, 129, 0.4)';
            
            setTimeout(() => {
                alert('Check-in berhasil dikonfirmasi untuk pasien ' + name + '!');
            }, 300);
        }, 1000);
    }
</script>
